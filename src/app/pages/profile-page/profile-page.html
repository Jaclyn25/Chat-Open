<app-navbar />

<main class="page-container">
  @if (user(); as u) {
    <div class="settings-grid">
      
      <!-- Sidebar Nav -->
      <aside class="settings-sidebar">
        <h2 class="sidebar-title">Settings</h2>
        <nav class="settings-nav">
          <a href="javascript:void(0)" class="nav-item active">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            Account Details
          </a>
          <a href="javascript:void(0)" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            Security
          </a>
          <a href="javascript:void(0)" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M7 15h0M2 9.5h20"/></svg>
            Billing
          </a>
          <a href="javascript:void(0)" class="nav-item text-red" (click)="logout()">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Log Out
          </a>
        </nav>
      </aside>

      <!-- Main Content -->
      <section class="settings-content">
        
        <!-- Profile Picture section -->
        <div class="settings-card">
          <h3 class="card-title">Profile Avatar</h3>
          <div class="avatar-row">
            <div class="avatar">{{ u.name.charAt(0) }}</div>
            <div class="avatar-actions">
              <app-custom-button variant="outline">Upload new picture</app-custom-button>
              <button class="remove-btn">Remove</button>
            </div>
          </div>
        </div>

        <!-- Personal Info -->
        <div class="settings-card">
          <h3 class="card-title">Personal Information</h3>
          <form [formGroup]="profileForm" (ngSubmit)="saveProfile()" class="info-form">
            <app-input-group
              id="name"
              label="Full Name"
              type="text"
              formControlName="name">
            </app-input-group>

            <app-input-group
              id="email"
              label="Email Address"
              type="email"
              formControlName="email">
            </app-input-group>

            <div class="form-actions">
              <app-custom-button type="submit" variant="primary">Save Changes</app-custom-button>
            </div>
          </form>
        </div>

        <!-- Danger Zone -->
        <div class="settings-card danger-zone">
          <div>
            <h3 class="card-title text-red">Danger Zone</h3>
            <p>Permanently delete your account and all associated conversational data.</p>
          </div>
          <app-custom-button variant="outline">Delete Account</app-custom-button>
        </div>

      </section>

    </div>
  }
</main>

<app-footer />
