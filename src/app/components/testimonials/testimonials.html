<section class="testimonials-section">
  <div class="testimonials-section__inner">
    <div #revealBlock class="testimonials__header reveal-up">
      <h2 class="testimonials__title">
        Trusted by <span class="glow-text">innovative</span> teams
      </h2>
    </div>

    <div #revealBlock class="testimonials__grid reveal-up" style="--delay: 150ms;">
      @for (testimonial of testimonials(); track testimonial.name) {
        <div class="testimonial-card">
          <div class="testimonial-card__stars">
            @for (i of [1,2,3,4,5]; track i) {
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="star"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
            }
          </div>
          
          <blockquote class="testimonial-card__quote">
            "{{ testimonial.quote }}"
          </blockquote>

          <div class="testimonial-card__author">
            <div class="testimonial-card__avatar" [style.color]="testimonial.accentColor">
              {{ testimonial.initials }}
              <!-- Subtle glow behind avatar -->
              <div class="testimonial-card__avatar-bg" [style.background]="testimonial.accentColor"></div>
            </div>
            <div>
              <div class="testimonial-card__name">{{ testimonial.name }}</div>
              <div class="testimonial-card__role">{{ testimonial.role }}, {{ testimonial.company }}</div>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
