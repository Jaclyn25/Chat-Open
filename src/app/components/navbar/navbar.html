<header class="navbar" [class.navbar--solid]="isScrolled()">
  <nav class="navbar__inner">
    <!-- Logo -->
    <a routerLink="/" class="navbar__logo" (click)="mobileOpen.set(false)" aria-label="ChatOPni home">
      <div class="navbar__logo-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
      </div>
      <span class="navbar__brand">Chat<span class="navbar__brand-accent">OPni</span></span>
    </a>

    <!-- Desktop links -->
    <ul class="navbar__links" role="list">
      @for (link of navLinks; track link.route) {
        <li>
          <a [routerLink]="link.route" 
             routerLinkActive="navbar__link--active"
             [routerLinkActiveOptions]="{exact: link.route === '/'}"
             class="navbar__link" 
             (click)="mobileOpen.set(false)">
            {{ link.label }}
          </a>
        </li>
      }
    </ul>

    <!-- Desktop CTA -->
    <div class="navbar__actions">
      <a routerLink="/auth" class="navbar__login">Log in</a>
      <app-custom-button variant="primary" routerLink="/auth">Get Started</app-custom-button>
    </div>

    <!-- Mobile burger -->
    <button class="navbar__burger" (click)="toggleMenu()" aria-label="Toggle navigation"
            [attr.aria-expanded]="mobileOpen()">
      <span [class.open-1]="mobileOpen()"></span>
      <span [class.open-2]="mobileOpen()"></span>
      <span [class.open-3]="mobileOpen()"></span>
    </button>
  </nav>

  <!-- Mobile drawer -->
  @if (mobileOpen()) {
    <div class="navbar__drawer" role="navigation">
      <ul role="list">
        @for (link of navLinks; track link.route) {
          <li>
            <a [routerLink]="link.route"
               routerLinkActive="navbar__drawer-link--active"
               [routerLinkActiveOptions]="{exact: link.route === '/'}"
               class="navbar__drawer-link" 
               (click)="mobileOpen.set(false)">
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
      <app-custom-button style="margin-top: 1rem; width: 100%;" variant="primary" routerLink="/auth" (click)="mobileOpen.set(false)">
        Get Started
      </app-custom-button>
    </div>
  }
</header>
